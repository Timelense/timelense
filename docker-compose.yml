services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timelense
      POSTGRES_PASSWORD: timelense
      POSTGRES_DB: timelense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelense"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://timelense:timelense@db:5432/timelense
      JWT_SECRET: change-me-in-production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
